<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scientific Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calculator">
  <h2>Scientific Calculator</h2>
  <input type="text" id="display" value="0" readonly>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="deleteLast()">DEL</button>
    <button class="func" onclick="appendValue('Math.sqrt(')">√</button>
    <button class="op" onclick="appendValue('/')">÷</button>

    <button class="func" onclick="appendValue('Math.sin(')">sin</button>
    <button class="func" onclick="appendValue('Math.cos(')">cos</button>
    <button class="func" onclick="appendValue('Math.tan(')">tan</button>
    <button class="op" onclick="appendValue('*')">×</button>

    <button class="func" onclick="appendValue('Math.log10(')">log</button>
    <button class="func" onclick="appendValue('Math.log(')">ln</button>
    <button class="func" onclick="square()">x²</button>
    <button class="op" onclick="appendValue('-')">−</button>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="op" onclick="appendValue('+')">+</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button onclick="appendValue('(')">(</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button onclick="appendValue(')')">)</button>

    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="func" onclick="appendValue('Math.PI')">π</button>
    <button class="eq" onclick="calculate()">=</button>
  </div>
</div>

<script>
  const display = document.getElementById('display');

  function appendValue(val) {
    if (display.value === '0') {
      display.value = val;
    } else {
      display.value += val;
    }
  }

  function clearDisplay() {
    display.value = '0';
  }

  function deleteLast() {
    display.value = display.value.slice(0, -1) || '0';
  }

  function square() {
    display.value = '(' + display.value + ')**2';
  }

  function calculate() {
    try {
      display.value = eval(display.value);
    } catch (e) {
      display.value = 'Error';
    }
  }
</script>

</body>
</html>
